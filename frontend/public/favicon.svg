<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="glow" x1="16" y1="12" x2="36" y2="40">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>
  <!-- Neural network nodes and edges -->
  <!-- Edges -->
  <line x1="24" y1="10" x2="14" y2="22" stroke="#c4b5fd" stroke-width="1.5" opacity="0.6"/>
  <line x1="24" y1="10" x2="34" y2="22" stroke="#c4b5fd" stroke-width="1.5" opacity="0.6"/>
  <line x1="14" y1="22" x2="24" y2="26" stroke="#c4b5fd" stroke-width="1.5" opacity="0.6"/>
  <line x1="34" y1="22" x2="24" y2="26" stroke="#c4b5fd" stroke-width="1.5" opacity="0.6"/>
  <line x1="14" y1="22" x2="10" y2="34" stroke="#c4b5fd" stroke-width="1.5" opacity="0.6"/>
  <line x1="34" y1="22" x2="38" y2="34" stroke="#c4b5fd" stroke-width="1.5" opacity="0.6"/>
  <line x1="24" y1="26" x2="18" y2="38" stroke="#c4b5fd" stroke-width="1.5" opacity="0.6"/>
  <line x1="24" y1="26" x2="30" y2="38" stroke="#c4b5fd" stroke-width="1.5" opacity="0.6"/>
  <line x1="10" y1="34" x2="18" y2="38" stroke="#c4b5fd" stroke-width="1.5" opacity="0.6"/>
  <line x1="38" y1="34" x2="30" y2="38" stroke="#c4b5fd" stroke-width="1.5" opacity="0.6"/>
  <!-- Central glow -->
  <circle cx="24" cy="26" r="8" fill="#7c3aed" opacity="0.15"/>
  <!-- Nodes -->
  <circle cx="24" cy="10" r="3.5" fill="white"/>
  <circle cx="14" cy="22" r="3" fill="url(#glow)"/>
  <circle cx="34" cy="22" r="3" fill="url(#glow)"/>
  <circle cx="24" cy="26" r="4" fill="white"/>
  <circle cx="10" cy="34" r="2.5" fill="url(#glow)"/>
  <circle cx="38" cy="34" r="2.5" fill="url(#glow)"/>
  <circle cx="18" cy="38" r="3" fill="url(#glow)"/>
  <circle cx="30" cy="38" r="3" fill="url(#glow)"/>
</svg>
