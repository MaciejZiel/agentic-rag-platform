[project]
name = "agentic-rag-platform"
version = "0.1.0"
description = "AI-powered document intelligence platform with RAG"
requires-python = ">=3.12,<4"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "redis>=5.2,<6",
    "celery[redis]>=5.4,<6",
    "qdrant-client>=1.13,<2",
    "openai>=1.60,<2",
    "python-multipart>=0.0.18",
    "python-docx>=1.1,<2",
    "pymupdf>=1.25,<2",
    "tiktoken>=0.8,<1",
    "structlog>=24.4,<25",
    "httpx>=0.28,<1",
    "tenacity>=9.0,<10",
    "psycopg2-binary>=2.9,<3",
    "slowapi>=0.1.9,<1",
    "prometheus-fastapi-instrumentator>=7,<8",
    "pydantic[email]>=2.10,<3",
    "pyjwt[crypto]>=2.9,<3",
    "passlib[bcrypt]>=1.7,<2",
    "bcrypt>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6.0,<7",
    "httpx>=0.28,<1",
    "factory-boy>=3.3,<4",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
