apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cortex-ingress
  namespace: cortex
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cortex.example.com
      secretName: cortex-tls
  rules:
    - host: cortex.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cortex-api-svc
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cortex-frontend-svc
                port:
                  number: 80
