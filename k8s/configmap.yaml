apiVersion: v1
kind: ConfigMap
metadata:
  name: cortex-config
  namespace: cortex
data:
  APP_NAME: cortex
  APP_ENV: production
  LOG_LEVEL: INFO
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_PREFIX: /api/v1
  POSTGRES_HOST: postgres-svc
  POSTGRES_PORT: "5432"
  POSTGRES_DB: rag_platform
  REDIS_HOST: redis-svc
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  QDRANT_HOST: qdrant-svc
  QDRANT_PORT: "6333"
  QDRANT_COLLECTION: documents
  EMBEDDING_MODEL: openai/text-embedding-3-small
  CHAT_MODEL: openai/gpt-4o-mini
  EMBEDDING_DIMENSIONS: "1536"
  UPLOAD_DIR: /data/uploads
  MAX_UPLOAD_SIZE_MB: "50"
  CORS_ORIGINS: "https://cortex.example.com"
  CELERY_BROKER_URL: redis://redis-svc:6379/0
  CELERY_RESULT_BACKEND: redis://redis-svc:6379/1
